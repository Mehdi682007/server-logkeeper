name: Check shell tool
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n logkeeper.sh
      - run: shellcheck logkeeper.sh
      - run: sudo apt-get update -qq && sudo apt-get install -y logrotate
      - run: sudo python3 tests/test_logkeeper.py
